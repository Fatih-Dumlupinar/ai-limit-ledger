name: Finalize Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to finalize as major.minor.patch (e.g. 0.7.1)'
        required: true
        type: string
      candidate_run_id:
        description: 'Successful Release Candidate workflow run ID to promote'
        required: true
        type: string
      commit_sha:
        description: 'Full 40-character commit SHA the candidate was built from'
        required: true
        type: string
      marketplace_url:
        description: 'Exact published Marketplace listing URL, confirming the manual upload'
        required: true
        type: string
      marketplace_confirmation:
        description: 'Type I_HAVE_VERIFIED_MARKETPLACE_<version> (e.g. I_HAVE_VERIFIED_MARKETPLACE_0.7.1) to confirm the manual Marketplace upload was verified'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: finalize-release-${{ github.workflow }}-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  EXPECTED_PUBLISHER: fatihdumlupinar-dev
  EXPECTED_NAME: ai-limit-ledger
  EXPECTED_EXTENSION_ID: fatihdumlupinar-dev.ai-limit-ledger
  EXPECTED_MARKETPLACE_URL: https://marketplace.visualstudio.com/items?itemName=fatihdumlupinar-dev.ai-limit-ledger
  CONFIRMATION_PREFIX: I_HAVE_VERIFIED_MARKETPLACE_

jobs:
  finalize:
    name: Finalize GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-release
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Every dispatch input is validated here, in the first step, against an anchored allowlist,
      # and only re-exported once it has passed. Nothing below this step ever reads inputs.* — it
      # reads the validated RELEASE_VERSION/RELEASE_TAG/RUN_ID/COMMIT_SHA environment variables
      # instead, so no user-supplied text can reach a path, a jq filter, or a command line
      # unvalidated. The Marketplace confirmation phrase is derived from the version only *after*
      # the version itself has passed the strict-SemVer gate.
      - name: Validate inputs against strict allowlist
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_RUN_ID: ${{ inputs.candidate_run_id }}
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
          INPUT_MARKETPLACE_URL: ${{ inputs.marketplace_url }}
          INPUT_CONFIRMATION: ${{ inputs.marketplace_confirmation }}
        run: |
          set -euo pipefail
          fail() { echo "$1" >&2; exit 1; }

          printf '%s' "$INPUT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || fail "version must be strict major.minor.patch (e.g. 0.7.1)"
          printf '%s' "$INPUT_RUN_ID" | grep -Eq '^[0-9]+$' \
            || fail "candidate_run_id must be a positive integer"
          printf '%s' "$INPUT_COMMIT_SHA" | grep -Eq '^[0-9a-f]{40}$' \
            || fail "commit_sha must be a full 40-character lowercase hex SHA"
          [ "$INPUT_MARKETPLACE_URL" = "$EXPECTED_MARKETPLACE_URL" ] \
            || fail "marketplace_url must be exactly $EXPECTED_MARKETPLACE_URL"

          expected_confirmation="${CONFIRMATION_PREFIX}${INPUT_VERSION}"
          [ "$INPUT_CONFIRMATION" = "$expected_confirmation" ] \
            || fail "marketplace_confirmation must be exactly $expected_confirmation"

          echo "RELEASE_VERSION=$INPUT_VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$INPUT_VERSION" >> "$GITHUB_ENV"
          echo "RUN_ID=$INPUT_RUN_ID" >> "$GITHUB_ENV"
          echo "COMMIT_SHA=$INPUT_COMMIT_SHA" >> "$GITHUB_ENV"

      - name: Checkout repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      # Since Task 14.2 a candidate can be produced two ways — automatically by a version bump
      # landing on main, or by a manual dispatch — so the promotable set is an explicit two-value
      # allowlist rather than a single equality. It is not widened beyond that: a candidate built by
      # any other event (a pull_request, a workflow_run chain, a repository_dispatch) is still
      # refused. The head-branch check added alongside it is a genuine tightening — the previous
      # single-event check never verified which branch the candidate was built from, and the
      # ancestry proof below only runs against the *input* SHA.
      - name: Verify candidate run belongs to this repository and succeeded
        run: |
          set -euo pipefail
          workflow_name="$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json workflowName --jq .workflowName)"
          event_name="$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json event --jq .event)"
          head_branch="$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json headBranch --jq .headBranch)"
          conclusion="$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)"
          head_sha="$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)"

          [ "$workflow_name" = "Release Candidate" ] || { echo "run $RUN_ID is not a Release Candidate run" >&2; exit 1; }
          case "$event_name" in
            push|workflow_dispatch) ;;
            *) echo "run $RUN_ID was triggered by $event_name, which cannot produce a promotable candidate" >&2; exit 1 ;;
          esac
          [ "$head_branch" = "main" ] || { echo "run $RUN_ID was built from $head_branch, not main" >&2; exit 1; }
          [ "$conclusion" = "success" ] || { echo "run $RUN_ID did not conclude successfully (conclusion: $conclusion)" >&2; exit 1; }
          [ "$head_sha" = "$COMMIT_SHA" ] || { echo "run $RUN_ID head SHA ($head_sha) does not match commit_sha input" >&2; exit 1; }

      - name: Verify commit is part of main's history
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          git merge-base --is-ancestor "$COMMIT_SHA" origin/main || {
            echo "commit_sha ($COMMIT_SHA) is not an ancestor of origin/main" >&2
            exit 1
          }

      - name: Download candidate artifact
        run: |
          set -euo pipefail
          # RELEASE_VERSION has already passed the anchored ^[0-9]+\.[0-9]+\.[0-9]+$ gate in the
          # first step, so it cannot carry a quote, a glob, or a jq metacharacter by the time it is
          # substituted into this filter string. `gh api --jq` has no `--arg` flag of its own to
          # bind it as a jq variable instead, which is why it is interpolated rather than passed.
          artifact_name="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            --jq ".artifacts[] | select(.name | startswith(\"ai-limit-ledger-${RELEASE_VERSION}-rc-\")) | .name" \
            | head -n1)"
          [ -n "$artifact_name" ] || { echo "no release-candidate artifact for $RELEASE_VERSION found on run $RUN_ID" >&2; exit 1; }
          echo "ARTIFACT_NAME=$artifact_name" >> "$GITHUB_ENV"

          rc_dir="$RUNNER_TEMP/rc-artifact"
          mkdir -p "$rc_dir"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n "$artifact_name" --dir "$rc_dir"
          echo "RC_DIR=$rc_dir" >> "$GITHUB_ENV"

      - name: Verify candidate artifact contains only the expected files
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' \
            "RELEASE_NOTES.md" \
            "SHA256SUMS.txt" \
            "ai-limit-ledger-${RELEASE_VERSION}.vsix" \
            "release-manifest.json" \
            "sbom.cdx.json" | LC_ALL=C sort)"
          actual="$(cd "$RC_DIR" && find . -mindepth 1 -printf '%P\n' | LC_ALL=C sort)"
          if [ "$expected" != "$actual" ]; then
            echo "candidate artifact contents do not match the expected file set" >&2
            echo "expected: $expected" >&2
            echo "actual: $actual" >&2
            exit 1
          fi

      - name: Verify candidate artifact integrity and identity
        run: |
          set -euo pipefail
          test -f "$RC_DIR/release-manifest.json"
          test -f "$RC_DIR/SHA256SUMS.txt"
          vsix="$RC_DIR/ai-limit-ledger-${RELEASE_VERSION}.vsix"
          test -f "$vsix"

          manifest_version="$(node -p "require('$RC_DIR/release-manifest.json').version")"
          manifest_commit="$(node -p "require('$RC_DIR/release-manifest.json').gitCommit")"
          manifest_publisher="$(node -p "require('$RC_DIR/release-manifest.json').publisher")"
          manifest_extension_id="$(node -p "require('$RC_DIR/release-manifest.json').extensionId")"
          manifest_sha="$(node -p "require('$RC_DIR/release-manifest.json').package.sha256")"

          [ "$manifest_version" = "$RELEASE_VERSION" ] || { echo "manifest version mismatch: $manifest_version" >&2; exit 1; }
          [ "$manifest_commit" = "$COMMIT_SHA" ] || { echo "manifest gitCommit does not match commit_sha input" >&2; exit 1; }
          [ "$manifest_publisher" = "$EXPECTED_PUBLISHER" ] || { echo "manifest publisher mismatch: $manifest_publisher" >&2; exit 1; }
          [ "$manifest_extension_id" = "$EXPECTED_EXTENSION_ID" ] || { echo "manifest extensionId mismatch: $manifest_extension_id" >&2; exit 1; }

          computed_sha="$(sha256sum "$vsix" | awk '{print $1}')"
          [ "$computed_sha" = "$manifest_sha" ] || { echo "recomputed VSIX SHA-256 does not match release-manifest.json" >&2; exit 1; }

          recorded_sha="$(awk '{print $1; exit}' "$RC_DIR/SHA256SUMS.txt")"
          [ "$computed_sha" = "$recorded_sha" ] || { echo "recomputed VSIX SHA-256 does not match SHA256SUMS.txt" >&2; exit 1; }

          echo "VSIX_PATH=$vsix" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Re-run VSIX release audit
        run: node scripts/release-audit.mjs "$VSIX_PATH"

      # Fail-closed and idempotent: an existing ref on the right commit is left exactly as it is,
      # an existing ref on any other commit aborts the run, and a missing one is created as an
      # annotated ref on the verified commit. There is no force-move and no delete-and-recreate
      # path anywhere in this workflow.
      - name: Create or verify the annotated release ref
        run: |
          set -euo pipefail
          existing_sha=""
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            object_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)"
            object_type="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.type)"
            if [ "$object_type" = "tag" ]; then
              existing_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" --jq .object.sha)"
            else
              existing_sha="$object_sha"
            fi
          fi

          if [ -n "$existing_sha" ]; then
            if [ "$existing_sha" != "$COMMIT_SHA" ]; then
              echo "$RELEASE_TAG already exists and points at $existing_sha, not $COMMIT_SHA — refusing to move it" >&2
              exit 1
            fi
            echo "$RELEASE_TAG already exists and matches commit_sha; leaving it untouched"
          else
            tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags" \
              -f tag="$RELEASE_TAG" \
              -f message="AI Limit Ledger $RELEASE_TAG (Preview)" \
              -f object="$COMMIT_SHA" \
              -f type=commit \
              -f "tagger[name]=github-actions[bot]" \
              -f "tagger[email]=41898282+github-actions[bot]@users.noreply.github.com" \
              --jq .sha)"
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$tag_sha"
            echo "created annotated $RELEASE_TAG at $COMMIT_SHA"
          fi

      - name: Create or verify GitHub Release
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
            if [ "$release_commit" != "$COMMIT_SHA" ]; then
              echo "release $RELEASE_TAG already exists but resolves to $release_commit, not $COMMIT_SHA" >&2
              exit 1
            fi
            echo "release $RELEASE_TAG already exists and matches commit_sha; will only add missing assets"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "AI Limit Ledger $RELEASE_TAG (Preview)" \
              --notes-file "$RC_DIR/RELEASE_NOTES.md" \
              --prerelease
          fi

      - name: Upload release assets without overwriting existing ones
        run: |
          set -euo pipefail
          existing_assets="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for f in "$RC_DIR/ai-limit-ledger-${RELEASE_VERSION}.vsix" "$RC_DIR/SHA256SUMS.txt" "$RC_DIR/release-manifest.json" "$RC_DIR/sbom.cdx.json" "$RC_DIR/RELEASE_NOTES.md"; do
            [ -f "$f" ] || continue
            base="$(basename "$f")"
            if printf '%s\n' "$existing_assets" | grep -qxF "$base"; then
              echo "asset $base already present on release $RELEASE_TAG; skipping (no overwrite)"
            else
              gh release upload "$RELEASE_TAG" "$f" --repo "$GITHUB_REPOSITORY"
            fi
          done
