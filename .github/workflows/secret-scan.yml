name: Secret Scan

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download and verify Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ARCHIVE: gitleaks_8.30.1_linux_x64.tar.gz
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GITLEAKS_URL: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          GITLEAKS_CHECKSUMS_URL: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/$GITLEAKS_ARCHIVE"
          checksums="$RUNNER_TEMP/gitleaks_checksums.txt"
          curl --fail --location --proto '=https' --tlsv1.2 "$GITLEAKS_URL" --output "$archive"
          curl --fail --location --proto '=https' --tlsv1.2 "$GITLEAKS_CHECKSUMS_URL" --output "$checksums"
          checksum_line="$(grep -F "$GITLEAKS_ARCHIVE" "$checksums")"
          checksum="$(printf '%s\n' "$checksum_line" | awk '{print $1}')"
          test "$checksum" = "$GITLEAKS_SHA256"
          printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          test -x "$RUNNER_TEMP/gitleaks"

      - name: Scan complete Git history with redacted output
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks" git "$GITHUB_WORKSPACE" \
            --config "$GITHUB_WORKSPACE/.gitleaks.toml" \
            --redact \
            --report-format sarif \
            --report-path "$RUNNER_TEMP/gitleaks.sarif" \
            --exit-code 1 \
            --no-banner

      - name: Upload redacted scan report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-sarif
          path: ${{ runner.temp }}/gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 7
