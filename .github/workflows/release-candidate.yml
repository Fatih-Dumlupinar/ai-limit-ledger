name: Release Candidate

# Two ways in, one behaviour.
#
# 1. Automatically, when a version bump lands on main. A push that touches package.json or
#    package-lock.json is the only thing that can start this; the resolve job then proves the
#    version actually *changed* before anything is built, so an unrelated manifest edit (a new
#    script, a dependency bump) resolves to "skipped" and produces no package.
# 2. Manually, by dispatching with an explicit version — the retry path when an automatic run was
#    skipped, or when a candidate needs rebuilding.
#
# Neither path can publish. This workflow builds, verifies, and attests a candidate and stops
# there: it holds contents: read, never touches the releases API, never creates or moves a ref, and
# has no Marketplace credential of any kind. Turning a candidate into a release is
# finalize-release.yml's job, behind a protected environment and a human-typed confirmation.
on:
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to build as major.minor.patch (e.g. 0.7.1) — must match package.json'
        required: true
        type: string

permissions:
  contents: read

# Scoped to the ref plus the specific target (dispatch version, or the pushed commit), so two
# different versions never contend, and never cancelling: a candidate build that is already running
# is a trusted, half-finished, attested artifact — a duplicate trigger queues behind it rather than
# killing it.
concurrency:
  group: release-candidate-${{ github.workflow }}-${{ github.ref }}-${{ inputs.version || github.sha }}
  cancel-in-progress: false

env:
  EXPECTED_PUBLISHER: fatihdumlupinar-dev
  EXPECTED_NAME: ai-limit-ledger

jobs:
  # -------------------------------------------------------------------------------------------
  # Stage 1 — decide whether there is anything to build.
  #
  # Separated into its own job precisely so that "no version change" can be a *successful* run that
  # builds nothing. Gating twenty steps on an `if:` inside one job would leave a packaging step one
  # editing mistake away from running on a non-bump push.
  # -------------------------------------------------------------------------------------------
  resolve:
    name: Resolve Release Candidate Target
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      version: ${{ steps.decide.outputs.version }}
      previous_version: ${{ steps.decide.outputs.previous_version }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - name: Verify trigger ref and event
        env:
          TRIGGER_REF: ${{ github.ref }}
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$TRIGGER_REF" != "refs/heads/main" ]; then
            echo "release-candidate only runs on main, got $TRIGGER_REF" >&2
            exit 1
          fi
          case "$TRIGGER_EVENT" in
            push|workflow_dispatch) ;;
            *) echo "unsupported trigger event: $TRIGGER_EVENT" >&2; exit 1 ;;
          esac

      # Full history is structurally required here for the same reason secret-scan.yml needs it:
      # the privacy audit's --history mode must be able to walk every reachable commit, and the
      # automatic trigger must read package.json as it stood at the previous main tip.
      - name: Checkout repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Every attacker-influenceable value — the dispatch input and github.event.before — reaches
      # the shell only through env:, is matched against an anchored allowlist before it is used,
      # and is re-exported only after it passes. github.event.before in particular is used solely
      # as a validated Git object reference, never as free shell text.
      - name: Decide whether a candidate is due
        id: decide
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          skip() {
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "previous_version=" >> "$GITHUB_OUTPUT"
            echo "reason=$1" >> "$GITHUB_OUTPUT"
            echo "SKIPPED: $1"
            exit 0
          }

          read_manifest_version() { node --print "require('./package.json').version"; }
          read_lock_version() { node --print "require('./package-lock.json').version"; }

          new_version="$(read_manifest_version)"
          lock_version="$(read_lock_version)"

          if ! printf '%s' "$new_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "package.json version is not strict major.minor.patch: $new_version" >&2
            exit 1
          fi
          if [ "$new_version" != "$lock_version" ]; then
            echo "package.json ($new_version) and package-lock.json ($lock_version) versions disagree" >&2
            exit 1
          fi

          if [ "$TRIGGER_EVENT" = "workflow_dispatch" ]; then
            if ! printf '%s' "$INPUT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "version input must be strict major.minor.patch (e.g. 0.7.1); got: $INPUT_VERSION" >&2
              exit 1
            fi
            if [ "$INPUT_VERSION" != "$new_version" ]; then
              echo "version input ($INPUT_VERSION) does not match package.json ($new_version)" >&2
              exit 1
            fi
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "version=$new_version" >> "$GITHUB_OUTPUT"
            echo "previous_version=(manual dispatch)" >> "$GITHUB_OUTPUT"
            echo "reason=manual dispatch for $new_version" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # --- automatic push path -----------------------------------------------------------
          # A missing, zero, or malformed "before" SHA means there is no previous state to compare
          # against (a brand-new branch, a force-updated ref, an unavailable event payload). That is
          # a skip, never a build: without a previous version this job cannot prove a bump happened.
          if ! printf '%s' "$BEFORE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            skip "push event carried no usable previous commit SHA"
          fi
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            skip "first push to the branch — no previous version to compare"
          fi
          if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            skip "previous commit is not present in this checkout"
          fi

          previous_version="$(git show "${BEFORE_SHA}:package.json" 2>/dev/null | node --print "JSON.parse(require('node:fs').readFileSync(0,'utf8')).version" || echo '')"
          previous_lock_version="$(git show "${BEFORE_SHA}:package-lock.json" 2>/dev/null | node --print "JSON.parse(require('node:fs').readFileSync(0,'utf8')).version" || echo '')"

          if [ -z "$previous_version" ]; then
            skip "previous package.json could not be read"
          fi
          if [ "$previous_version" = "$new_version" ]; then
            skip "package.json changed but the version did not ($new_version)"
          fi
          if ! printf '%s' "$previous_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            skip "previous version was not strict major.minor.patch"
          fi
          # Both files must carry the same change, or the bump is half-applied and the lockfile
          # would ship disagreeing with the manifest.
          if [ "$previous_lock_version" != "$previous_version" ]; then
            echo "previous package-lock.json ($previous_lock_version) disagreed with package.json ($previous_version)" >&2
            exit 1
          fi

          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "version=$new_version" >> "$GITHUB_OUTPUT"
          echo "previous_version=$previous_version" >> "$GITHUB_OUTPUT"
          echo "reason=version bumped from $previous_version to $new_version" >> "$GITHUB_OUTPUT"

      - name: Summarize a skipped run
        if: steps.decide.outputs.should_build != 'true'
        env:
          SKIP_REASON: ${{ steps.decide.outputs.reason }}
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          {
            echo "## Release Candidate — skipped"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Trigger | \`$TRIGGER_EVENT\` |"
            echo "| Result | no candidate built |"
            echo "| Reason | $SKIP_REASON |"
            echo ""
            echo "No package, checksum, SBOM, manifest, or attestation was produced."
            echo "No ref and no GitHub Release were created. Nothing was uploaded to the Marketplace."
            echo ""
            echo "To build a candidate for the current version anyway, dispatch this workflow manually"
            echo "from main with the exact version as input."
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------------------------------
  # Stage 2 — build, verify, and attest the candidate.
  # -------------------------------------------------------------------------------------------
  build:
    name: Build Release Candidate
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      RELEASE_TAG: v${{ needs.resolve.outputs.version }}
    steps:
      # The version arrives from the resolve job, which has already matched it against the anchored
      # strict-SemVer grammar and against package.json. It is re-checked here so this job is safe on
      # its own terms rather than trusting an upstream output.
      - name: Re-validate the resolved version
        run: |
          set -euo pipefail
          if ! printf '%s' "$RELEASE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "resolved version is not strict major.minor.patch: $RELEASE_VERSION" >&2
            exit 1
          fi

      - name: Checkout repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the checked-out commit is the one that triggered this run
        env:
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          local_sha="$(git rev-parse HEAD)"
          if [ "$local_sha" != "$TRIGGER_SHA" ]; then
            echo "checked-out commit ($local_sha) does not match the triggering commit" >&2
            exit 1
          fi
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$local_sha" origin/main; then
            echo "candidate commit is not part of main's history — refusing to build" >&2
            exit 1
          fi
          echo "GIT_COMMIT_SHA=$local_sha" >> "$GITHUB_ENV"

      # A candidate must never be built for a version that has already been finalized: the release
      # ref is immutable, so an existing ref means this version is spent. This workflow only reads
      # refs — it has contents: read and never creates, moves, or deletes one.
      - name: Refuse to build a candidate for an already-released version
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --quiet origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "$RELEASE_TAG already exists on origin — refusing to build a candidate for a released version" >&2
            exit 1
          fi
          echo "$RELEASE_TAG does not exist yet; safe to build a candidate"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify package manifest identity and version
        run: |
          set -euo pipefail
          node --eval '
            const pkg = require("./package.json");
            const lock = require("./package-lock.json");
            const expectedVersion = process.env.RELEASE_VERSION;
            const errors = [];
            if (pkg.version !== expectedVersion) errors.push(`package.json version ${pkg.version} !== ${expectedVersion}`);
            if (lock.version !== expectedVersion) errors.push(`package-lock.json version ${lock.version} !== ${expectedVersion}`);
            if (!lock.packages || !lock.packages[""] || lock.packages[""].version !== expectedVersion) {
              errors.push("package-lock.json packages[\"\"] version does not match");
            }
            if (pkg.publisher !== process.env.EXPECTED_PUBLISHER) errors.push(`publisher ${pkg.publisher} !== ${process.env.EXPECTED_PUBLISHER}`);
            if (pkg.name !== process.env.EXPECTED_NAME) errors.push(`name ${pkg.name} !== ${process.env.EXPECTED_NAME}`);
            if (`${pkg.publisher}.${pkg.name}` !== `${process.env.EXPECTED_PUBLISHER}.${process.env.EXPECTED_NAME}`) {
              errors.push("computed extension id does not match the expected Marketplace identity");
            }
            if (pkg.preview !== true) errors.push("preview must be exactly true");
            if (pkg.private !== true) errors.push("private must be exactly true");
            if (errors.length > 0) {
              console.error(errors.join("\n"));
              process.exit(1);
            }
          '

      # The release notes path is built from RELEASE_VERSION only after the strict-SemVer gate
      # above, so no user-supplied path fragment ("..", a slash, a glob) can ever reach it.
      - name: Verify changelog entry and release notes exist
        run: |
          set -euo pipefail
          node --eval '
            const { readFileSync, existsSync } = require("node:fs");
            const version = process.env.RELEASE_VERSION;
            const notesPath = `docs/RELEASE-NOTES-${version}.md`;
            const errors = [];
            const changelog = readFileSync("CHANGELOG.md", "utf8");
            const heading = new RegExp(`^##\\s+\\[?${version.replace(/\./g, "\\.")}\\]?\\s*$`, "m");
            if (!heading.test(changelog)) errors.push(`CHANGELOG.md has no "## ${version}" section heading`);
            if (!/^##\s+\[Unreleased\]\s*$/m.test(changelog)) errors.push("CHANGELOG.md must keep an [Unreleased] section");
            if (!existsSync(notesPath)) errors.push(`${notesPath} is missing`);
            else if (readFileSync(notesPath, "utf8").trim().length === 0) errors.push(`${notesPath} is empty`);
            if (errors.length > 0) {
              console.error(errors.join("\n"));
              process.exit(1);
            }
            console.log(`changelog section and ${notesPath} verified for ${version}`);
          '

      - name: Record toolchain versions
        run: |
          set -euo pipefail
          echo "RELEASE_NODE_VERSION=$(node --version)" >> "$GITHUB_ENV"
          echo "RELEASE_NPM_VERSION=$(npm --version)" >> "$GITHUB_ENV"

      - name: Install locked dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Verify workflow policy
        run: npm run verify:workflows

      - name: Audit all dependencies
        run: npm audit --audit-level=moderate

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit source-tree release readiness
        run: npm run audit:release

      # ---- Privacy gates -------------------------------------------------------------------
      # These three run *before* anything is uploaded, signed, or described in a manifest. A
      # failure here stops the job outright, so a package carrying personal data can never reach an
      # artifact, an SBOM, an attestation, or a release manifest. The tool prints only pattern ids,
      # locations, structural masks, and fingerprints — a matched value is discarded before it can
      # be rendered, so these logs are safe to read and safe to share.
      - name: Privacy audit — source tree
        run: npm run audit:privacy

      - name: Privacy audit — git history
        run: npm run audit:privacy -- --history

      - name: Run full test suite
        run: npm test

      - name: Collect test metrics
        run: npx vitest run --reporter=json --outputFile="$RUNNER_TEMP/vitest-report.json"

      - name: Collect audit summaries
        run: |
          set -euo pipefail
          npm audit --json > "$RUNNER_TEMP/npm-audit-all.json"
          npm audit --omit=dev --json > "$RUNNER_TEMP/npm-audit-prod.json"

      - name: Build VSIX package
        run: npm run package

      - name: Locate packaged VSIX
        run: |
          set -euo pipefail
          expected="ai-limit-ledger-${RELEASE_VERSION}.vsix"
          test -f "$expected"
          echo "VSIX_PATH=$expected" >> "$GITHUB_ENV"

      - name: Privacy audit — packaged VSIX
        run: npm run audit:privacy -- --vsix "$VSIX_PATH"

      - name: Audit packaged VSIX
        run: npm run audit:release -- "$VSIX_PATH"

      - name: Generate SHA-256 checksum
        run: |
          set -euo pipefail
          sha256sum "$VSIX_PATH" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "VSIX_SHA256=$(awk '{print $1}' SHA256SUMS.txt)" >> "$GITHUB_ENV"

      - name: Generate SBOM
        run: node scripts/generate-sbom.mjs sbom.cdx.json

      - name: Generate release manifest
        env:
          RELEASE_VSIX_PATH: ${{ env.VSIX_PATH }}
          RELEASE_VITEST_JSON_PATH: ${{ runner.temp }}/vitest-report.json
          RELEASE_AUDIT_ALL_JSON: ${{ runner.temp }}/npm-audit-all.json
          RELEASE_AUDIT_PROD_JSON: ${{ runner.temp }}/npm-audit-prod.json
          RELEASE_GIT_COMMIT: ${{ env.GIT_COMMIT_SHA }}
          RELEASE_NODE_VERSION: ${{ env.RELEASE_NODE_VERSION }}
          RELEASE_NPM_VERSION: ${{ env.RELEASE_NPM_VERSION }}
          RELEASE_WORKFLOW_RUN_ID: ${{ github.run_id }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: node scripts/generate-release-manifest.mjs release-manifest.json

      - name: Copy release notes
        run: |
          set -euo pipefail
          cp "docs/RELEASE-NOTES-${RELEASE_VERSION}.md" RELEASE_NOTES.md

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.VSIX_PATH }}

      - name: Compute short commit SHA for artifact naming
        run: echo "SHORT_SHA=${GIT_COMMIT_SHA:0:12}" >> "$GITHUB_ENV"

      # Seven days: long enough for the owner to download the candidate, complete the manual
      # Marketplace upload, and dispatch Finalize Release, and short enough that an unpromoted
      # candidate does not linger as a downloadable build artifact. A candidate that expires is not
      # lost — it is rebuilt deterministically from the same commit by dispatching this workflow.
      - name: Upload release candidate artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-limit-ledger-${{ env.RELEASE_VERSION }}-rc-${{ env.SHORT_SHA }}
          path: |
            *.vsix
            SHA256SUMS.txt
            release-manifest.json
            sbom.cdx.json
            RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 7

      - name: Summarize the candidate
        if: always()
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          RESOLVE_REASON: ${{ needs.resolve.outputs.reason }}
          PREVIOUS_VERSION: ${{ needs.resolve.outputs.previous_version }}
        run: |
          set -euo pipefail
          {
            echo "## Release Candidate — $RELEASE_VERSION"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Trigger | \`$TRIGGER_EVENT\` |"
            echo "| Reason | $RESOLVE_REASON |"
            echo "| Previous version | $PREVIOUS_VERSION |"
            echo "| Version | $RELEASE_VERSION |"
            echo "| Commit | \`${GIT_COMMIT_SHA:-unknown}\` |"
            echo "| Publisher | $EXPECTED_PUBLISHER |"
            echo "| Extension ID | $EXPECTED_PUBLISHER.$EXPECTED_NAME |"
            echo "| Tests | full suite run before packaging |"
            echo "| Privacy audit | source, history, and packaged VSIX all passed |"
            echo "| VSIX SHA-256 | \`${VSIX_SHA256:-not produced}\` |"
            echo "| Artifact retention | 7 days |"
            echo ""
            echo "### What this run did NOT do"
            echo ""
            echo "- It did **not** upload anything to the Visual Studio Marketplace."
            echo "- It did **not** create, move, or delete a tag, and did **not** create a GitHub Release."
            echo "- It held \`contents: read\` throughout and used no publishing credential."
            echo ""
            echo "### Next step (manual)"
            echo ""
            echo "1. Download this run's artifact and verify the SHA-256 above."
            echo "2. Upload the VSIX to the Marketplace by hand and confirm the listing renders."
            echo "3. Dispatch **Finalize Release** with this version, this run's ID, and this commit SHA."
            echo ""
            echo "_Privacy audit findings are reported as pattern id, location, mask, and fingerprint only;"
            echo "no matched value appears in this summary or in the job log._"
          } >> "$GITHUB_STEP_SUMMARY"
